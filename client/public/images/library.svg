<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="ספרייה עתיקה">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a4a"/>
      <stop offset="1" stop-color="#1c1428"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#3a2616"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect y="520" width="1280" height="200" fill="url(#floor)"/>
  <!-- ארון ספרים שמאלי -->
  <g>
    <rect x="60" y="90" width="360" height="450" fill="#5a3b22" stroke="#2e1d10" stroke-width="6"/>
    <g fill="#2e1d10"><rect x="60" y="195" width="360" height="8"/><rect x="60" y="305" width="360" height="8"/><rect x="60" y="415" width="360" height="8"/></g>
    <g>
      <rect x="85" y="120" width="28" height="75" fill="#8c3a3a"/><rect x="118" y="132" width="24" height="63" fill="#3a5f8c"/><rect x="147" y="115" width="30" height="80" fill="#6b8c3a"/>
      <rect x="300" y="125" width="28" height="70" fill="#8c6b3a"/><rect x="333" y="118" width="26" height="77" fill="#7a3a8c"/>
      <rect x="85" y="230" width="30" height="75" fill="#3a8c7a"/><rect x="120" y="240" width="26" height="65" fill="#8c3a3a"/>
      <rect x="320" y="228" width="30" height="77" fill="#3a5f8c"/><rect x="355" y="238" width="26" height="67" fill="#8c6b3a"/>
      <rect x="95" y="340" width="28" height="75" fill="#6b8c3a"/><rect x="130" y="335" width="30" height="80" fill="#8c3a3a"/>
      <rect x="300" y="345" width="28" height="70" fill="#7a3a8c"/>
    </g>
  </g>
  <!-- ארון ספרים ימני (חלק מהספרים נעלמו) -->
  <g>
    <rect x="860" y="90" width="360" height="450" fill="#5a3b22" stroke="#2e1d10" stroke-width="6"/>
    <g fill="#2e1d10"><rect x="860" y="195" width="360" height="8"/><rect x="860" y="305" width="360" height="8"/><rect x="860" y="415" width="360" height="8"/></g>
    <rect x="885" y="122" width="28" height="73" fill="#3a5f8c"/><rect x="1150" y="232" width="30" height="73" fill="#8c3a3a"/>
  </g>
  <!-- אח / ארון עץ במרכז -->
  <rect x="520" y="230" width="240" height="290" rx="10" fill="#4a2f1b" stroke="#2e1d10" stroke-width="6"/>
  <rect x="545" y="255" width="190" height="240" rx="6" fill="#3a2414"/>
  <circle cx="715" cy="380" r="9" fill="#d9b25f"/>
  <!-- שולחן עם ספר פתוח -->
  <rect x="470" y="520" width="340" height="24" fill="#7a5230"/>
  <rect x="490" y="544" width="18" height="100" fill="#5a3b22"/><rect x="772" y="544" width="18" height="100" fill="#5a3b22"/>
  <path d="M560 515 L640 495 L720 515 L720 520 L560 520 Z" fill="#f2e8cf" stroke="#8c7a55" stroke-width="3"/>
  <!-- אור -->
  <rect width="1280" height="720" fill="url(#glow)"/>
  <circle cx="640" cy="60" r="10" fill="#ffd98a"/>
  <rect x="636" y="0" width="8" height="55" fill="#2e1d10"/>
</svg>
